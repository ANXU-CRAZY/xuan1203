# Include inside the existing HTTPS server block.
location = /geostudio { return 301 /geostudio/$is_args$args; }
location /geostudio/static/ {
    alias /srv/ark-geostudio/static_root/;
    autoindex off;
}
location /geostudio/ {
    client_max_body_size 52M;
    proxy_pass http://unix:/run/ark-geostudio/gunicorn.sock;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
    proxy_buffering off;
}
