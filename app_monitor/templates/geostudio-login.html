{% load static %}<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · ARK GeoStudio</title>
<style>body{margin:0;background:#f1f6f4;color:#17333d;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.card{box-sizing:border-box;width:min(420px,calc(100% - 32px));padding:36px;background:white;border-radius:18px;box-shadow:0 14px 50px #164c4920}img{width:64px;display:block;margin:0 auto}h1{text-align:center;font-size:23px}p{text-align:center;color:#657f7e}label{display:block;margin:18px 0 6px}input{box-sizing:border-box;width:100%;border:1px solid #cadbd7;border-radius:8px;padding:12px;font:inherit}button{width:100%;margin-top:24px;padding:13px;background:#298a91;color:white;border:0;border-radius:8px;font:inherit;cursor:pointer}a{color:#267b83}.error{color:#ad3838}</style></head><body><main class="card"><img src="{% static 'app_monitor/img/logo.png' %}" alt="方舟实验室"><h1>方舟视界 · 智「析」一切</h1><p>See Beyond. Understand More.</p><p>使用平台账号登录空间分析与小舟智能体</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<label for="username">用户名</label><input id="username" name="username" autocomplete="username" required><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">登录</button></form><p><a href="/platform/login/">注册或找回密码</a> · <a href="{% url 'home' %}">返回工作台</a></p></main></body></html>
