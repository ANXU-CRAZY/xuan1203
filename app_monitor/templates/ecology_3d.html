<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>黄河生态三维场景</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/supermap-sdk/en/Build/SuperMap3D/Widgets/widgets.css">
  <style>
    html, body, #cesium { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101a1d; font-family: "Microsoft YaHei", Arial, sans-serif; }
    #cesium { opacity: 0; transition: opacity .35s ease; }
    body.scene-ready #cesium { opacity: 1; }
    .bar { position: fixed; z-index: 20; left: 18px; top: 18px; width: 286px; background: #fff; padding: 12px 14px; border-radius: 5px; box-shadow: 0 4px 18px #0005; color: #183b3e; }
    .bar b { display: block; margin-bottom: 5px; font-size: 18px; }
    .bar span { font-size: 12px; color: #677; }
    .bar a { display: inline-block; margin-top: 8px; margin-right: 5px; color: #086b78; text-decoration: none; border: 1px solid #cfdcda; padding: 5px 8px; border-radius: 3px; }
    .state { position: fixed; z-index: 20; right: 18px; top: 18px; max-width: 360px; background: #fff; padding: 9px 12px; border-radius: 4px; font-size: 12px; color: #526; }
    .state.error { color: #9f2431; }
    .view-tools { position: fixed; z-index: 20; right: 18px; bottom: 18px; display: flex; gap: 6px; }
    .view-tools button { border: 1px solid #c7d7d2; background: #ffffff; color: #155562; padding: 7px 10px; border-radius: 3px; cursor: pointer; font: 13px "Microsoft YaHei", Arial, sans-serif; }
    .view-tools button:hover { background: #eaf6f0; }
    .calib { position: fixed; z-index: 30; left: 18px; bottom: 18px; background: #fff; padding: 10px 12px; border-radius: 5px; box-shadow: 0 4px 18px #0005; font: 12px "Microsoft YaHei", Arial, sans-serif; color: #183b3e; display: none; }
    .calib b { display: block; margin-bottom: 6px; }
    .calib label { display: inline-block; width: 74px; }
    .calib input { width: 90px; padding: 2px 4px; margin: 2px 0; }
    .calib button { margin-top: 6px; padding: 4px 14px; cursor: pointer; }
    @media (max-width: 700px) {
      .bar { left: 10px; top: 10px; width: calc(100% - 48px); padding: 10px 12px; }
      .bar b { font-size: 16px; }
      .state { left: 10px; right: 10px; top: 134px; max-width: none; }
      #diag { top: 196px !important; }
      .view-tools { left: 10px; right: 10px; bottom: 10px; justify-content: flex-end; flex-wrap: wrap; }
      .view-tools button { padding: 6px 8px; font-size: 12px; }
      .calib { left: 10px; right: 10px; bottom: 58px; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <b>黄河生态三维场景</b>
    <span>天地图影像 + 观测点位 + 黄河生态要素</span><br>
    <a href="/ecology/">返回二维决策</a>
    <a target="_blank" rel="noopener" href="http://127.0.0.1:8090/iserver/services/map-YellowRiverSuperMap/rest/maps/YellowRiverEcologyMap">底图服务</a>
  </div>
  <div id="state" class="state">正在初始化 SuperMap 三维引擎...</div>
  <div id="diag" class="state" style="display:none;top:60px;max-width:400px;background:#1a2a2d;color:#0f8;font:12px monospace;"></div>
  <div id="calib" class="calib">
    <b>影像校准(对准行政区)</b>
    <label>原点经度 ox</label><input id="cOx" type="number" step="0.001"><br>
    <label>原点纬度 oy</label><input id="cOy" type="number" step="0.001"><br>
    <label>瓦片基准 ts</label><input id="cTs" type="number" step="0.01"><br>
    <button type="button" id="cApply">应用</button>
    <button type="button" id="cClose">收起</button>
  </div>
  <div id="layers" class="calib">
    <b>图层控制</b>
    <label><input type="checkbox" id="lImage" checked> 影像底图</label><br>
    <label><input type="checkbox" id="lColumns" checked> 3D 柱状图(观测数量)</label><br>
    <label><input type="checkbox" id="lPoints" checked> 观测点位</label><br>
    <label><input type="checkbox" id="lRegion" checked> 三市行政区</label><br>
    <label><input type="checkbox" id="lRiver" checked> 黄河主河道</label><br>
    <label><input type="checkbox" id="lLabels" checked> 生态注记</label><br>
    <button type="button" id="lClose">收起</button>
  </div>
  <div class="view-tools" aria-label="3D view presets">
    <button type="button" data-view="overview">黄河全域</button>
    <button type="button" data-view="taihang">太行山地形</button>
    <button type="button" data-view="zhengzhou">郑州北部</button>
    <button type="button" data-view="calib">校准</button>
    <button type="button" data-view="layers">图层</button>
  </div>
  <div id="cesium"></div>

  <script src="/supermap-sdk/en/Build/SuperMap3D/SuperMap3D.js"></script>
  <script>
    (function () {
      var state = document.getElementById('state');
      var ISERVER = 'http://127.0.0.1:8090/iserver';
      var TDT_KEY = '0de0375367832014891a9f40e0e42911';
      var params = new URLSearchParams(location.search);
      var hasLinkedLocation = params.has('lng') && params.has('lat');
      var lng = Number(params.get('lng') || 113.78);
      var lat = Number(params.get('lat') || 35.05);

      function setState(message, isError) {
        state.textContent = message;
        state.classList.toggle('error', Boolean(isError));
      }

      function flyToPreset(scene, preset) {
        var views = {
          overview: { lng: 113.72, lat: 34.40, height: 135000, heading: 0, pitch: -62 },
          taihang: { lng: 113.72, lat: 35.14, height: 32000, heading: 305, pitch: -24 },
          zhengzhou: { lng: 113.70, lat: 34.72, height: 36000, heading: 0, pitch: -50 }
        };
        var view = views[preset] || views.overview;
        scene.camera.flyTo({
          destination: SuperMap3D.Cartesian3.fromDegrees(view.lng, view.lat, view.height),
          orientation: {
            heading: SuperMap3D.Math.toRadians(view.heading),
            pitch: SuperMap3D.Math.toRadians(view.pitch),
            roll: 0
          },
          duration: 1.2
        });
      }

      // 校准状态(校准面板可调整;当前为与行政区对齐的标定值)
      var originX = Number(params.get('ox') || 112.54238);
      var originY = Number(params.get('oy') || 35.90152);
      var tileSpan = Number(params.get('ts') || 4.3);
      var flip = params.get('flip') === '1';

      function buildDemImageryProvider() {
        // DEM 影像瓦片端点(实测可用):
        //   .../datas/{DEM}/data/index/{y}/{x}.png?level={level}
        // 索引规则(经逐级实测):原点 (112.64238, 35.81152),
        //   层级 L 瓦片尺寸 = 5.69 / 2^L 度,可用层级 0-6。
        // 校准参数(?ox= 原点经度 ?oy= 原点纬度 ?ts= 瓦片基准 ?flip=1 上下翻转)
        var DEM_DATAS = 'YellowRiver_DEM_GLO30_StudyArea@YellowRiverEcology3D';
        var tileBase = ISERVER + '/services/3D-YellowRiverEcology3D/rest/realspace/datas/'
          + encodeURIComponent(DEM_DATAS) + '/data/index';
        var scheme = new SuperMap3D.GeographicTilingScheme({
          rectangle: SuperMap3D.Rectangle.fromDegrees(
            originX, originY - tileSpan, originX + tileSpan, originY),
          numberOfLevelZeroTilesX: 1,
          numberOfLevelZeroTilesY: 1,
          tileWidth: 256,
          tileHeight: 256
        });
        var tileUrl = flip
          ? tileBase + '/{reverseY}/{x}.png?level={z}'
          : tileBase + '/{y}/{x}.png?level={z}';
        return new SuperMap3D.UrlTemplateImageryProvider({
          url: tileUrl,
          tilingScheme: scheme,
          minimumLevel: 0,
          // 实测该服务仅 0-6 级有完整瓦片;7 级全 404,8 级以上只回角落脏缓存。
          maximumLevel: 6
        });
      }

      function buildTiandituImageryProvider(layer) {
        return new SuperMap3D.UrlTemplateImageryProvider({
          url: 'https://t{s}.tianditu.gov.cn/' + layer + '_w/wmts'
            + '?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0'
            + '&LAYER=' + layer + '&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles'
            + '&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=' + TDT_KEY,
          subdomains: ['0', '1', '2', '3', '4', '5', '6', '7'],
          minimumLevel: 0,
          maximumLevel: 18
        });
      }

      async function isDemImageryAvailable() {
        try {
          var response = await fetch('/api/ecology/dem-imagery-health/', {
            credentials: 'same-origin',
            cache: 'no-store'
          });
          if (!response.ok) { return false; }
          var payload = await response.json();
          return payload.available === true;
        } catch (error) {
          console.warn('DEM imagery health probe failed:', error);
          return false;
        }
      }

      async function installImagery(scene) {
        var baseLayer = scene.imageryLayers.addImageryProvider(buildTiandituImageryProvider('img'));
        var demLayer = null;
        var demAvailable = await isDemImageryAvailable();
        if (demAvailable) {
          demLayer = scene.imageryLayers.addImageryProvider(buildDemImageryProvider());
        } else {
          console.warn('iServer DEM imagery unavailable; using Tianditu imagery without retries.');
        }
        var labelLayer = scene.imageryLayers.addImageryProvider(buildTiandituImageryProvider('cia'));
        window.__yellowRiverBaseLayer = baseLayer;
        window.__yellowRiverBaseLabelLayer = labelLayer;
        window.__yellowRiverDemLayer = demLayer;
        window.__yellowRiverImageryMode = demLayer ? 'iServer DEM 专题影像' : '天地图影像（iServer 专题影像暂不可用）';
        return demLayer;
      }

      async function addOverlays(viewer) {
        // 叠加分别加载、分别容错,单个失败不影响整体。
        await addRiverOverlay(viewer);
        await addThreeCityOverlay(viewer);
        await addLabelOverlay(viewer);
        await addObservationColumns(viewer);
        await addObservationPoints(viewer);
      }

      function safeFetch(url) {
        return fetch(url)
          .then(function (response) {
            if (!response.ok) { throw new Error('HTTP ' + response.status); }
            return response.json();
          })
          .catch(function (error) {
            console.warn('Overlay unavailable:', url, error);
            return { type: 'FeatureCollection', features: [] };
          });
      }

      async function addRiverOverlay(viewer) {
        var river = await safeFetch('/api/ecology/scene-assets/river/');
        if (!river.features || !river.features.length) { return; }
        var riverSource = await SuperMap3D.GeoJsonDataSource.load(river, {
          stroke: SuperMap3D.Color.CYAN,
          strokeWidth: 5,
          clampToGround: true
        });
        riverSource.entities.values.forEach(function (entity) {
          if (entity.polyline) {
            entity.polyline.width = 5;
            entity.polyline.material = SuperMap3D.Color.fromCssColorString('#20d8ff');
            entity.polyline.clampToGround = true;
          }
        });
        viewer.dataSources.add(riverSource);
        window.__yellowRiverRiver = riverSource;
      }

      async function addThreeCityOverlay(viewer) {
        // 行政区来自三维场景同工作空间发布的数据服务(YellowRiverEcology3D:threecity),
        // 直接查询 3 个要素的 REGION 几何并转为 GeoJSON 渲染。
        var dataBase = ISERVER + '/services/data-YellowRiverEcology3D/rest/data'
          + '/datasources/name/YellowRiverEcology3D/datasets/name/threecity/features';
        var features = [];
        for (var i = 1; i <= 3; i++) {
          var f = await safeFetch(dataBase + '/' + i + '.json');
          if (!f || !f.geometry) { continue; }
          features.push(f);
        }
        if (!features.length) { return; }
        var polygons = [];
        features.forEach(function (f) {
          var g = f.geometry;
          var parts = g.parts || [g.points.length];
          var pts = g.points || [];
          var offset = 0;
          for (var p = 0; p < parts.length; p++) {
            var ring = [];
            for (var k = 0; k < parts[p]; k++) {
              var pt = pts[offset + k];
              if (pt && isFinite(pt.x) && isFinite(pt.y)) { ring.push([pt.x, pt.y]); }
            }
            offset += parts[p];
            if (ring.length > 2) { polygons.push(ring); }
          }
        });
        if (!polygons.length) { return; }
        var geojson = {
          type: 'FeatureCollection',
          features: polygons.map(function (ring) {
            return { type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [ring] } };
          })
        };
        var regionSource = await SuperMap3D.GeoJsonDataSource.load(geojson, {
          stroke: SuperMap3D.Color.fromCssColorString('#f6db7a'),
          fill: SuperMap3D.Color.fromCssColorString('#f6db7a').withAlpha(0.14),
          strokeWidth: 2,
          clampToGround: true
        });
        regionSource.entities.values.forEach(function (entity) {
          if (entity.polygon) {
            entity.polygon.material = SuperMap3D.Color.fromCssColorString('#f6db7a').withAlpha(0.14);
            entity.polygon.outline = false;
          }
        });
        viewer.dataSources.add(regionSource);
        window.__yellowRiverRegion = regionSource;

        // 地形上多边形描边会被禁用,改用贴地折线绘制行政边界,保证界线上可见。
        var borderSource = new SuperMap3D.CustomDataSource('region-borders');
        polygons.forEach(function (ring) {
          var positions = [];
          for (var k = 0; k < ring.length; k++) {
            positions.push(SuperMap3D.Cartesian3.fromDegrees(ring[k][0], ring[k][1], 0));
          }
          if (positions.length > 1) {
            borderSource.entities.add({
              polyline: {
                positions: positions,
                width: 2.5,
                material: SuperMap3D.Color.fromCssColorString('#f6db7a'),
                clampToGround: true
              }
            });
          }
        });
        viewer.dataSources.add(borderSource);
        window.__yellowRiverRegionBorders = borderSource;
      }

      async function addLabelOverlay(viewer) {
        var labels = await safeFetch('/static/app_monitor/eco/Ecology_Annotations_ascii.geojson');
        if (!labels.features || !labels.features.length) { return; }
        var labelSource = await SuperMap3D.GeoJsonDataSource.load(labels, { clampToGround: true });
        labelSource.entities.values.forEach(function (entity) {
          var name = entity.properties && (entity.properties.name || entity.properties.label);
          if (name) {
            entity.label = new SuperMap3D.LabelGraphics({
              text: String(name.getValue ? name.getValue() : name),
              font: 'bold 22px Microsoft YaHei',
              fillColor: SuperMap3D.Color.WHITE,
              outlineColor: SuperMap3D.Color.fromCssColorString('#12333a'),
              outlineWidth: 4,
              style: SuperMap3D.LabelStyle.FILL_AND_OUTLINE,
              verticalOrigin: SuperMap3D.VerticalOrigin.BOTTOM,
              pixelOffset: new SuperMap3D.Cartesian2(0, -12),
              heightReference: SuperMap3D.HeightReference.CLAMP_TO_GROUND
            });
          }
        });
        viewer.dataSources.add(labelSource);
        window.__yellowRiverLabels = labelSource;
      }

      async function addObservationPoints(viewer) {
        // 观测点位来自项目自己的 API(约 1 万个),覆盖整个研究区。
        var data = await safeFetch('/api/map-observations/');
        var points = data.results || [];
        if (!points.length) { return; }
        var collection = new SuperMap3D.PointPrimitiveCollection();
        var pointColor = SuperMap3D.Color.fromCssColorString('#ff9f1c');
        var added = 0;
        for (var i = 0; i < points.length; i++) {
          var p = points[i];
          var pLng = Number(p.lng != null ? p.lng : p.longitude);
          var pLat = Number(p.lat != null ? p.lat : p.latitude);
          if (!isFinite(pLng) || !isFinite(pLat)) { continue; }
          if (pLng < 111.5 || pLng > 115.5 || pLat < 33.5 || pLat > 36.5) { continue; }
          if (p.status && p.status !== 'approved') { continue; }
          collection.add({
            position: SuperMap3D.Cartesian3.fromDegrees(pLng, pLat, 0),
            pixelSize: 5,
            color: pointColor,
            outlineColor: SuperMap3D.Color.WHITE,
            outlineWidth: 1,
            // 观测点坐标未带高程值，保持点位在起伏地形前可见。
            disableDepthTestDistance: Number.POSITIVE_INFINITY
          });
          added++;
        }
        if (added) {
          viewer.scene.primitives.add(collection);
          window.__yellowRiverPoints = collection;
          console.log('Observation points overlay:', added);
        }
      }

      async function addObservationColumns(viewer) {
        // 3D 柱状图:观测数量按 0.02° 网格聚合,柱高正比于数量,
        // 弥补无地形缓存的立体感(真实三维体量可视化)。
        var data = await safeFetch('/api/map-observations/');
        var points = data.results || [];
        var cells = {};
        for (var i = 0; i < points.length; i++) {
          var p = points[i];
          var pLng = Number(p.lng != null ? p.lng : p.longitude);
          var pLat = Number(p.lat != null ? p.lat : p.latitude);
          if (!isFinite(pLng) || !isFinite(pLat)) { continue; }
          if (pLng < 111.5 || pLng > 115.5 || pLat < 33.5 || pLat > 36.5) { continue; }
          if (p.status && p.status !== 'approved') { continue; }
          var key = Math.round(pLng * 50) + '_' + Math.round(pLat * 50);
          var c = cells[key] || (cells[key] = { lng: 0, lat: 0, n: 0, count: 0 });
          c.lng += pLng; c.lat += pLat; c.n++; c.count += Number(p.count || 0);
        }
        var list = [];
        for (var k in cells) {
          var cell = cells[k];
          cell.lng /= cell.n; cell.lat /= cell.n;
          list.push(cell);
        }
        list.sort(function (a, b) { return b.count - a.count; });
        var top = list.slice(0, 300);
        if (!top.length) { return; }
        var maxCount = top[0].count || 1;
        var ds = new SuperMap3D.CustomDataSource('observation-columns');
        for (var j = 0; j < top.length; j++) {
          var c = top[j];
          var t = c.count / maxCount;
          var h = 800 + 9000 * t;
          var color = t > 0.66 ? '#e03131' : (t > 0.33 ? '#ff9f1c' : '#37b24d');
          ds.entities.add({
            position: SuperMap3D.Cartesian3.fromDegrees(c.lng, c.lat, h / 2),
            cylinder: {
              length: h,
              topRadius: 750,
              bottomRadius: 750,
              material: SuperMap3D.Color.fromCssColorString(color).withAlpha(0.88),
              outline: true,
              outlineColor: SuperMap3D.Color.WHITE.withAlpha(0.35)
            }
          });
        }
        viewer.dataSources.add(ds);
        window.__yellowRiverColumns = ds;
        console.log('Observation columns:', top.length);
      }

      async function start() {
        if (!window.SuperMap3D) {
          throw new Error('本机 SuperMap3D SDK 未加载');
        }

        var viewer = new SuperMap3D.Viewer('cesium', {
          animation: false,
          timeline: false,
          baseLayerPicker: false,
          geocoder: false,
          infoBox: false,
          selectionIndicator: false,
          navigation: true,
          // 不加载默认全球底图,只显示下面手动添加的 iServer 底图影像。
          imageryProvider: false,
          // iServer 2025U1 WebGL 包使用 2 表示 WebGL2。
          contextOptions: { contextType: 2 }
        });
        window.__yellowRiverViewer = viewer;

        var scene = await viewer.scenePromise;
        window.__yellowRiverScene = scene;

        // 本地 quantized-mesh 缓存已修正 v 方向和边界裙边顺序。
        // DEM 是本页的必需数据：加载失败时直接停止，不回退到平坦椭球。
        setState('正在加载本地 DEM 三维地形...');
        var terrainProvider = new SuperMap3D.SuperMapTerrainProvider({
          url: '/api/terrain/datas/terrain',
          isSct: true
        });
        window.__yellowRiverTerrainProvider = terrainProvider;
        if (terrainProvider.errorEvent) {
          terrainProvider.errorEvent.addEventListener(function (error) {
            console.error('TERRAIN TILE ERROR:', error && error.message ? error.message : error);
          });
        }
        try {
          await terrainProvider.readyPromise;
        } catch (terrainError) {
          throw new Error('真实 DEM 地形加载失败：' + (terrainError && terrainError.message
            ? terrainError.message : '本地地形缓存不可用'));
        }
        scene.globe.terrainProvider = terrainProvider;
        scene.terrainExaggeration = 4.0;
        console.log('Local DEM terrain ready');

        if (params.get('debug') === '1') {
          var diag = document.getElementById('diag');
          diag.style.display = 'block';
          var info = 'Terrain: READY\n';
          info += 'Exaggeration: ' + scene.terrainExaggeration + '\n';
          info += 'isSct: ' + terrainProvider._isSct + '\n';
          if (terrainProvider._levels) info += 'Levels: ' + terrainProvider._levels.join(',') + '\n';
          if (terrainProvider._levelZeroMaximumGeometricError != null) {
            info += 'L0 GeoError: ' + terrainProvider._levelZeroMaximumGeometricError.toFixed(1) + '\n';
          }
          info += 'Globe terrainProvider ready: ' + scene.globe.terrainProvider.ready + '\n';
          diag.textContent = info;
        }

        // iServer DEM 影像先做服务端单瓦片探测。若返回 503，直接使用天地图，
        // 避免浏览器并发请求失败瓦片造成页面卡顿。
        setState('正在检查影像服务...');
        var demLayer = await installImagery(scene);

        // 校准面板:调整 ox/oy/ts 后点"应用",影像层即时重建。
        var calibEl = document.getElementById('calib');
        function fillCalib() {
          document.getElementById('cOx').value = originX;
          document.getElementById('cOy').value = originY;
          document.getElementById('cTs').value = tileSpan;
        }
        fillCalib();
        document.getElementById('cApply').addEventListener('click', function () {
          originX = Number(document.getElementById('cOx').value);
          originY = Number(document.getElementById('cOy').value);
          tileSpan = Number(document.getElementById('cTs').value);
          if (!demLayer) {
            setState('iServer DEM 影像当前不可用，已保留天地图底图与本地地形。', true);
            return;
          }
          try {
            scene.imageryLayers.remove(demLayer);
            demLayer = scene.imageryLayers.addImageryProvider(buildDemImageryProvider());
            window.__yellowRiverDemLayer = demLayer;
            setState('已应用校准: ox=' + originX + ' oy=' + originY + ' ts=' + tileSpan);
          } catch (e) {
            setState('校准应用失败: ' + e.message, true);
          }
        });
        document.getElementById('cClose').addEventListener('click', function () {
          calibEl.style.display = 'none';
        });

        setState('正在叠加黄河线、行政区与生态注记...');
        await addOverlays(viewer);

        if (hasLinkedLocation) {
          scene.camera.setView({
            destination: SuperMap3D.Cartesian3.fromDegrees(lng, lat, 60000),
            orientation: {
              heading: SuperMap3D.Math.toRadians(25),
              pitch: SuperMap3D.Math.toRadians(-32),
              roll: 0
            }
          });
        } else {
          flyToPreset(scene, 'overview');
        }

        document.querySelectorAll('[data-view]').forEach(function (button) {
          button.addEventListener('click', function () {
            if (button.dataset.view === 'calib') {
              fillCalib();
              calibEl.style.display = 'block';
              return;
            }
            if (button.dataset.view === 'layers') {
              document.getElementById('layers').style.display = 'block';
              return;
            }
            flyToPreset(scene, button.dataset.view);
          });
        });

        // 图层控制开关
        function bindLayerToggle(id, getLayer, showSetter) {
          var cb = document.getElementById(id);
          if (!cb || !getLayer()) { return; }
          cb.addEventListener('change', function () { showSetter(getLayer(), cb.checked); });
        }
        var imageToggle = document.getElementById('lImage');
        imageToggle.addEventListener('change', function () {
          var visible = imageToggle.checked;
          if (window.__yellowRiverBaseLayer) { window.__yellowRiverBaseLayer.show = visible; }
          if (window.__yellowRiverBaseLabelLayer) { window.__yellowRiverBaseLabelLayer.show = visible; }
          if (window.__yellowRiverDemLayer) { window.__yellowRiverDemLayer.show = visible; }
        });
        bindLayerToggle('lColumns', function () { return window.__yellowRiverColumns; }, function (l, v) { l.show = v; });
        bindLayerToggle('lPoints', function () { return window.__yellowRiverPoints; }, function (l, v) { l.show = v; });
        bindLayerToggle('lRegion', function () { return window.__yellowRiverRegion; }, function (l, v) { l.show = v; });
        bindLayerToggle('lRiver', function () { return window.__yellowRiverRiver; }, function (l, v) { l.show = v; });
        bindLayerToggle('lLabels', function () { return window.__yellowRiverLabels; }, function (l, v) { l.show = v; });
        document.getElementById('lClose').addEventListener('click', function () {
          document.getElementById('layers').style.display = 'none';
        });

        setState('三维视图已就绪：真实 DEM 地形 + ' + window.__yellowRiverImageryMode
          + ' + 观测点位、黄河线、行政区与生态注记');
        document.body.classList.add('scene-ready');
      }
      start().catch(function (error) {
        console.error('YellowRiver 3D startup failed:', error);
        setState('三维场景加载失败：' + (error && error.message ? error.message : '未知错误'), true);
      });
    }());
  </script>
</body>
</html>
