<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黄河湿地生态决策简报</title><style>body{margin:0;background:#edf2f0;color:#173a3c;font:14px "Microsoft YaHei",Arial}.sheet{width:min(900px,calc(100% - 32px));margin:24px auto;background:#fff;padding:42px 52px;box-shadow:0 4px 24px #0002}h1{margin:0;color:#086b78}h2{font-size:17px;margin-top:28px;border-bottom:2px solid #16805e;padding-bottom:7px}.meta{color:#70817e;margin:8px 0 22px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#eef7f4;border-left:4px solid #16805e;padding:13px}.metric strong{font-size:22px;display:block;color:#086b78}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #dde7e4}.note{background:#fff8e7;border:1px solid #ead9a6;padding:11px;line-height:1.6}.actions{position:fixed;right:20px;top:20px}.actions button,.actions a{border:1px solid #ccd9d6;background:#fff;padding:8px 12px;text-decoration:none;color:#173a3c;cursor:pointer;margin-left:5px}@media print{body{background:#fff}.sheet{width:auto;margin:0;box-shadow:none;padding:20px}.actions{display:none}}@media(max-width:650px){.sheet{padding:24px}.summary{grid-template-columns:1fr}}</style></head><body><div class="actions"><a href="/ecology/">返回决策中心</a><button onclick="print()">打印 / 导出 PDF</button></div><article class="sheet"><h1 id="title">黄河湿地生态决策简报</h1><div id="meta" class="meta">正在汇总真实成果...</div><div id="summary" class="summary"></div><h2>研究方法</h2><ol id="methods"></ol><h2>行政区生态承载统计</h2><table><thead><tr><th>城市</th><th>观测记录</th><th>鸟类数量</th><th>物种数</th><th>压力指数</th></tr></thead><tbody id="capacity"></tbody></table><h2>数据来源</h2><ul id="sources"></ul><h2>结果使用说明</h2><div id="disclaimer" class="note"></div></article><script>fetch('/api/ecology/report-data/').then(r=>r.json()).then(p=>{document.querySelector('#title').textContent=p.title;document.querySelector('#meta').textContent=`${p.study_area} · ${p.generated_at}`;const total=p.capacity.reduce((s,x)=>s+x.record_count,0),species=Math.max(...p.capacity.map(x=>x.species_count));document.querySelector('#summary').innerHTML=`<div class="metric"><strong>${p.core_area_km2} km²</strong>复现核心区面积</div><div class="metric"><strong>${total.toLocaleString()}</strong>三市观测记录</div><div class="metric"><strong>${species}</strong>最大分区物种数</div>`;document.querySelector('#methods').innerHTML=p.methods.map(x=>`<li>${x}</li>`).join('');document.querySelector('#capacity').innerHTML=p.capacity.map(x=>`<tr><td>${x.city}</td><td>${x.record_count.toLocaleString()}</td><td>${x.bird_count.toLocaleString()}</td><td>${x.species_count}</td><td>${x.pressure_index}</td></tr>`).join('');document.querySelector('#sources').innerHTML=p.sources.map(x=>`<li>${x}</li>`).join('');document.querySelector('#disclaimer').textContent=p.disclaimer})</script></body></html>
